<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)"/>
  </g>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="200" r="150" fill="none" stroke="url(#glowGrad)" stroke-width="1" opacity="0.3"/>
  <circle cx="1100" cy="200" r="120" fill="none" stroke="url(#glowGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Browser mockup -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="450" height="280" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <rect x="0" y="0" width="450" height="30" rx="8" fill="#161b22"/>
    <circle cx="20" cy="15" r="6" fill="#f85149"/>
    <circle cx="40" cy="15" r="6" fill="#d29922"/>
    <circle cx="60" cy="15" r="6" fill="#3fb950"/>
    <rect x="100" y="8" width="250" height="14" rx="3" fill="#0d1117"/>
    
    <!-- Code/UI elements in browser -->
    <g transform="translate(20, 50)">
      <!-- Scanning lines -->
      <rect x="0" y="0" width="410" height="3" fill="url(#accentGrad)" opacity="0.8">
        <animate attributeName="y" values="0;200;0" dur="3s" repeatCount="indefinite"/>
      </rect>
      
      <!-- UI Elements being analyzed -->
      <rect x="10" y="20" width="180" height="30" rx="4" fill="#30363d" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3"/>
      <rect x="10" y="60" width="120" height="25" rx="4" fill="#238636" opacity="0.8"/>
      <rect x="140" y="60" width="80" height="25" rx="4" fill="#1f6feb" opacity="0.8"/>
      <rect x="10" y="100" width="390" height="40" rx="4" fill="#21262d" stroke="#a371f7" stroke-width="1"/>
      <rect x="10" y="150" width="200" height="60" rx="4" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
      <rect x="220" y="150" width="180" height="60" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Eye/Vision icon -->
  <g transform="translate(120, 140)" filter="url(#glow)">
    <ellipse cx="60" cy="60" rx="55" ry="35" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="60" cy="60" r="20" fill="url(#accentGrad)"/>
    <circle cx="60" cy="60" r="8" fill="#0d1117"/>
    <!-- Scan rays -->
    <line x1="130" y1="60" x2="200" y2="30" stroke="#58a6ff" stroke-width="2" opacity="0.6"/>
    <line x1="130" y1="60" x2="200" y2="60" stroke="#a371f7" stroke-width="2" opacity="0.6"/>
    <line x1="130" y1="60" x2="200" y2="90" stroke="#3fb950" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Main title -->
  <text x="120" y="280" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#accentGrad)">VUDA</text>
  <text x="120" y="320" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">Visual UI Debug Agent</text>
  <text x="120" y="350" font-family="SF Mono, Consolas, Liberation Mono, Menlo, monospace" font-size="14" fill="#58a6ff">MCP Server for AI-Powered UI Testing</text>
  
  <!-- Stats badges -->
  <g transform="translate(120, 370)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#238636"/>
    <text x="40" y="15" font-family="SF Mono, monospace" font-size="11" fill="white" text-anchor="middle">29 Tools</text>
    
    <rect x="90" y="0" width="100" height="22" rx="11" fill="#1f6feb"/>
    <text x="140" y="15" font-family="SF Mono, monospace" font-size="11" fill="white" text-anchor="middle">Playwright</text>
    
    <rect x="200" y="0" width="70" height="22" rx="11" fill="#a371f7"/>
    <text x="235" y="15" font-family="SF Mono, monospace" font-size="11" fill="white" text-anchor="middle">MCP</text>
  </g>
</svg>
