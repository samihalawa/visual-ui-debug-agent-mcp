<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="200" fill="#0d1117"/>
  
  <!-- Screenshot icon -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="100" height="100" rx="12" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <rect x="15" y="15" width="70" height="50" rx="4" fill="#161b22"/>
    <circle cx="50" cy="85" r="10" fill="#58a6ff"/>
    <text x="50" y="130" font-family="system-ui" font-size="12" fill="#8b949e" text-anchor="middle">Screenshot</text>
  </g>
  
  <!-- Workflow icon -->
  <g transform="translate(200, 50)">
    <rect x="0" y="0" width="100" height="100" rx="12" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
    <circle cx="25" cy="30" r="8" fill="#a371f7"/>
    <circle cx="75" cy="30" r="8" fill="#a371f7"/>
    <circle cx="50" cy="70" r="8" fill="#a371f7"/>
    <line x1="25" y1="38" x2="50" y2="62" stroke="#a371f7" stroke-width="2"/>
    <line x1="75" y1="38" x2="50" y2="62" stroke="#a371f7" stroke-width="2"/>
    <text x="50" y="130" font-family="system-ui" font-size="12" fill="#8b949e" text-anchor="middle">Workflows</text>
  </g>
  
  <!-- Performance icon -->
  <g transform="translate(350, 50)">
    <rect x="0" y="0" width="100" height="100" rx="12" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <polyline points="15,70 35,50 55,60 75,25 85,35" fill="none" stroke="#3fb950" stroke-width="3"/>
    <text x="50" y="130" font-family="system-ui" font-size="12" fill="#8b949e" text-anchor="middle">Performance</text>
  </g>
  
  <!-- API icon -->
  <g transform="translate(500, 50)">
    <rect x="0" y="0" width="100" height="100" rx="12" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="50" y="45" font-family="monospace" font-size="14" fill="#f0883e" text-anchor="middle">{API}</text>
    <rect x="20" y="55" width="60" height="8" rx="2" fill="#f0883e" opacity="0.5"/>
    <rect x="20" y="68" width="45" height="8" rx="2" fill="#f0883e" opacity="0.5"/>
    <text x="50" y="130" font-family="system-ui" font-size="12" fill="#8b949e" text-anchor="middle">API Testing</text>
  </g>
  
  <!-- Vision icon -->
  <g transform="translate(650, 50)">
    <rect x="0" y="0" width="100" height="100" rx="12" fill="#21262d" stroke="#f85149" stroke-width="2"/>
    <ellipse cx="50" cy="50" rx="30" ry="20" fill="none" stroke="#f85149" stroke-width="2"/>
    <circle cx="50" cy="50" r="10" fill="#f85149"/>
    <text x="50" y="130" font-family="system-ui" font-size="12" fill="#8b949e" text-anchor="middle">Visual AI</text>
  </g>
</svg>