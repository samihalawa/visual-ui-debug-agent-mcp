<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149"/>
      <stop offset="100%" style="stop-color:#da3633"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="450" y="35" font-family="system-ui" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="600">VUDA Automated Issue Detection</text>
  <text x="450" y="55" font-family="system-ui" font-size="12" fill="#6e7681" text-anchor="middle">One command finds what manual testing misses</text>

  <!-- BEFORE Section -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="400" height="440" rx="10" fill="#21262d" stroke="#f85149" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="35" rx="10" fill="#da3633"/>
    <text x="200" y="24" font-family="system-ui" font-size="14" fill="white" text-anchor="middle" font-weight="600">BEFORE: Manual Testing</text>

    <!-- Hidden issues -->
    <g transform="translate(15, 50)">
      <text x="0" y="20" font-family="system-ui" font-size="12" fill="#8b949e" font-weight="600">Issues Hidden in Production:</text>

      <!-- Issue 1: Broken Links -->
      <g transform="translate(0, 35)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#f85149">Broken Links (Undetected)</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">/about/team returns 404 - users see error page</text>
        <text x="15" y="50" font-family="system-ui" font-size="9" fill="#6e7681">Last click: 3 days ago - still broken</text>
      </g>

      <!-- Issue 2: Slow Pages -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#d29922">Slow Checkout (Unnoticed)</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">/checkout takes 8.3s to load - users abandon cart</text>
        <text x="15" y="50" font-family="system-ui" font-size="9" fill="#6e7681">Conversion rate dropped 23% this week</text>
      </g>

      <!-- Issue 3: Console Errors -->
      <g transform="translate(0, 165)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#f85149">JS Errors (Invisible)</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">TypeError: Cannot read property 'map' of undefined</text>
        <text x="15" y="50" font-family="system-ui" font-size="9" fill="#6e7681">Product gallery broken on 12 pages</text>
      </g>

      <!-- Issue 4: Mobile Broken -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#f85149">Mobile Layout (Unknown)</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">Signup button off-screen on iPhone SE</text>
        <text x="15" y="50" font-family="system-ui" font-size="9" fill="#6e7681">Mobile signups down 45%</text>
      </g>

      <!-- Issue 5: Login Flow -->
      <g transform="translate(0, 295)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1"/>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#d29922">Auth Flow (Untested)</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">Password reset email link expired after 5 mins</text>
        <text x="15" y="50" font-family="system-ui" font-size="9" fill="#6e7681">Support tickets up 340%</text>
      </g>

      <!-- Summary -->
      <g transform="translate(0, 360)">
        <rect x="0" y="0" width="370" height="30" rx="4" fill="#f85149"/>
        <text x="185" y="20" font-family="system-ui" font-size="12" fill="white" text-anchor="middle" font-weight="600">5+ Critical Issues = Revenue Loss</text>
      </g>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(440, 300)">
    <polygon points="0,0 20,15 0,30" fill="#58a6ff"/>
    <text x="5" y="-8" font-family="system-ui" font-size="10" fill="#58a6ff" text-anchor="middle">VUDA</text>
  </g>

  <!-- AFTER Section -->
  <g transform="translate(470, 80)">
    <rect x="0" y="0" width="400" height="440" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <rect x="0" y="0" width="400" height="35" rx="10" fill="#238636"/>
    <text x="200" y="24" font-family="system-ui" font-size="14" fill="white" text-anchor="middle" font-weight="600">AFTER: VUDA Scan (23 seconds)</text>

    <!-- Detected and Fixed -->
    <g transform="translate(15, 50)">
      <text x="0" y="20" font-family="system-ui" font-size="12" fill="#3fb950" font-weight="600">All Issues Detected Automatically:</text>

      <!-- Detection 1 -->
      <g transform="translate(0, 35)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
        <circle cx="350" cy="27" r="12" fill="#238636"/>
        <text x="350" y="32" font-family="system-ui" font-size="12" fill="white" text-anchor="middle">OK</text>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#3fb950">sitemap_crawler</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">Found 3 broken links across 47 pages</text>
        <text x="15" y="50" font-family="SF Mono, monospace" font-size="9" fill="#58a6ff">/about/team, /blog/old, /products/legacy</text>
      </g>

      <!-- Detection 2 -->
      <g transform="translate(0, 100)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
        <circle cx="350" cy="27" r="12" fill="#238636"/>
        <text x="350" y="32" font-family="system-ui" font-size="12" fill="white" text-anchor="middle">OK</text>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#3fb950">performance_analysis</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">Flagged 5 slow pages with exact metrics</text>
        <text x="15" y="50" font-family="SF Mono, monospace" font-size="9" fill="#58a6ff">/checkout: 8.3s, /gallery: 4.2s, /search: 3.8s</text>
      </g>

      <!-- Detection 3 -->
      <g transform="translate(0, 165)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
        <circle cx="350" cy="27" r="12" fill="#238636"/>
        <text x="350" y="32" font-family="system-ui" font-size="12" fill="white" text-anchor="middle">OK</text>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#3fb950">console_monitor</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">Captured 47 JS errors with stack traces</text>
        <text x="15" y="50" font-family="SF Mono, monospace" font-size="9" fill="#58a6ff">12 pages affected, root cause identified</text>
      </g>

      <!-- Detection 4 -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
        <circle cx="350" cy="27" r="12" fill="#238636"/>
        <text x="350" y="32" font-family="system-ui" font-size="12" fill="white" text-anchor="middle">OK</text>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#3fb950">batch_screenshot_urls</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">94 screenshots (desktop + mobile)</text>
        <text x="15" y="50" font-family="SF Mono, monospace" font-size="9" fill="#58a6ff">Visual comparison revealed layout issues</text>
      </g>

      <!-- Detection 5 -->
      <g transform="translate(0, 295)">
        <rect x="0" y="0" width="370" height="55" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
        <circle cx="350" cy="27" r="12" fill="#238636"/>
        <text x="350" y="32" font-family="system-ui" font-size="12" fill="white" text-anchor="middle">OK</text>
        <text x="15" y="20" font-family="SF Mono, monospace" font-size="11" fill="#3fb950">navigation_flow_validator</text>
        <text x="15" y="38" font-family="system-ui" font-size="10" fill="#8b949e">Tested 12 user flows end-to-end</text>
        <text x="15" y="50" font-family="SF Mono, monospace" font-size="9" fill="#58a6ff">Login, signup, checkout, password reset</text>
      </g>

      <!-- Summary -->
      <g transform="translate(0, 360)">
        <rect x="0" y="0" width="370" height="30" rx="4" fill="#238636"/>
        <text x="185" y="20" font-family="system-ui" font-size="12" fill="white" text-anchor="middle" font-weight="600">All Issues Found in 23 Seconds</text>
      </g>
    </g>
  </g>
</svg>
