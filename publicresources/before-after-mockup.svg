<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="errorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f85149"/>
      <stop offset="100%" style="stop-color:#da3633"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad3)"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid3" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#ffffff" stroke-width="0.2" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="900" height="500" fill="url(#grid3)"/>

  <!-- Title -->
  <text x="450" y="35" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="600">Manual Testing vs VUDA Automation</text>

  <!-- BEFORE Panel -->
  <g transform="translate(30, 60)" filter="url(#shadow3)">
    <!-- Panel frame -->
    <rect width="400" height="400" rx="12" fill="#1e1e32" stroke="#f85149" stroke-width="2"/>

    <!-- Header -->
    <rect width="400" height="40" rx="12" fill="url(#errorGrad)"/>
    <rect y="28" width="400" height="12" fill="url(#errorGrad)"/>
    <text x="200" y="27" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">BEFORE: Manual Testing</text>

    <!-- Issue cards -->
    <g transform="translate(15, 55)">

      <!-- Issue 1: Broken Link -->
      <g transform="translate(0, 0)">
        <rect width="175" height="80" rx="8" fill="#2a1a20" stroke="#f85149" stroke-width="1"/>
        <!-- X icon -->
        <circle cx="30" cy="30" r="16" fill="#f85149" opacity="0.2"/>
        <text x="30" y="35" font-family="SF Pro Display, sans-serif" font-size="16" fill="#f85149" text-anchor="middle" font-weight="700">X</text>
        <text x="95" y="28" font-family="SF Mono, monospace" font-size="10" fill="#f85149" text-anchor="middle">/team</text>
        <text x="88" y="45" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">404 Error</text>
        <text x="88" y="70" font-family="SF Pro Text, sans-serif" font-size="8" fill="#6e7681" text-anchor="middle">Undetected 3 days</text>
      </g>

      <!-- Issue 2: Slow Page -->
      <g transform="translate(190, 0)">
        <rect width="175" height="80" rx="8" fill="#2a2a1a" stroke="#ffd93d" stroke-width="1"/>
        <!-- Clock icon -->
        <circle cx="30" cy="30" r="16" fill="#ffd93d" opacity="0.2"/>
        <circle cx="30" cy="30" r="10" fill="none" stroke="#ffd93d" stroke-width="2"/>
        <line x1="30" y1="30" x2="30" y2="23" stroke="#ffd93d" stroke-width="2"/>
        <line x1="30" y1="30" x2="35" y2="32" stroke="#ffd93d" stroke-width="2"/>
        <text x="95" y="28" font-family="SF Mono, monospace" font-size="10" fill="#ffd93d" text-anchor="middle">/checkout</text>
        <text x="88" y="45" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">8.3s load time</text>
        <text x="88" y="70" font-family="SF Pro Text, sans-serif" font-size="8" fill="#6e7681" text-anchor="middle">Users abandon</text>
      </g>

      <!-- Issue 3: JS Error -->
      <g transform="translate(0, 95)">
        <rect width="175" height="80" rx="8" fill="#2a1a20" stroke="#f85149" stroke-width="1"/>
        <!-- Bug icon -->
        <circle cx="30" cy="30" r="16" fill="#f85149" opacity="0.2"/>
        <text x="30" y="36" font-family="SF Pro Display, sans-serif" font-size="14" fill="#f85149" text-anchor="middle">!</text>
        <text x="95" y="25" font-family="SF Mono, monospace" font-size="9" fill="#f85149" text-anchor="middle">TypeError</text>
        <text x="88" y="42" font-family="SF Pro Text, sans-serif" font-size="8" fill="#8888aa" text-anchor="middle">Cannot read 'map'</text>
        <text x="88" y="70" font-family="SF Pro Text, sans-serif" font-size="8" fill="#6e7681" text-anchor="middle">12 pages broken</text>
      </g>

      <!-- Issue 4: Mobile Layout -->
      <g transform="translate(190, 95)">
        <rect width="175" height="80" rx="8" fill="#2a1a20" stroke="#f85149" stroke-width="1"/>
        <!-- Phone icon -->
        <circle cx="30" cy="30" r="16" fill="#f85149" opacity="0.2"/>
        <rect x="22" y="18" width="16" height="24" rx="2" fill="none" stroke="#f85149" stroke-width="2"/>
        <line x1="28" y1="38" x2="32" y2="38" stroke="#f85149" stroke-width="2"/>
        <text x="95" y="28" font-family="SF Mono, monospace" font-size="10" fill="#f85149" text-anchor="middle">Mobile</text>
        <text x="88" y="45" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">Button off-screen</text>
        <text x="88" y="70" font-family="SF Pro Text, sans-serif" font-size="8" fill="#6e7681" text-anchor="middle">-45% signups</text>
      </g>

      <!-- Issue 5: Auth Flow -->
      <g transform="translate(0, 190)">
        <rect width="175" height="80" rx="8" fill="#2a2a1a" stroke="#ffd93d" stroke-width="1"/>
        <!-- Lock icon -->
        <circle cx="30" cy="30" r="16" fill="#ffd93d" opacity="0.2"/>
        <rect x="22" y="26" width="16" height="12" rx="2" fill="none" stroke="#ffd93d" stroke-width="2"/>
        <path d="M25 26 V22 A5 5 0 0 1 35 22 V26" fill="none" stroke="#ffd93d" stroke-width="2"/>
        <text x="95" y="28" font-family="SF Mono, monospace" font-size="10" fill="#ffd93d" text-anchor="middle">Auth Flow</text>
        <text x="88" y="45" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">Reset link expires</text>
        <text x="88" y="70" font-family="SF Pro Text, sans-serif" font-size="8" fill="#6e7681" text-anchor="middle">+340% tickets</text>
      </g>

      <!-- Hidden issues indicator -->
      <g transform="translate(190, 190)">
        <rect width="175" height="80" rx="8" fill="#1a1a30" stroke="#6e7681" stroke-width="1" stroke-dasharray="4,2"/>
        <text x="88" y="35" font-family="SF Pro Display, sans-serif" font-size="20" fill="#6e7681" text-anchor="middle">?</text>
        <text x="88" y="55" font-family="SF Pro Text, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">More hidden</text>
        <text x="88" y="70" font-family="SF Pro Text, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">issues...</text>
      </g>

      <!-- Bottom summary -->
      <g transform="translate(0, 290)">
        <rect width="370" height="45" rx="8" fill="#3a1a20" stroke="#f85149" stroke-width="1"/>
        <text x="185" y="20" font-family="SF Pro Display, sans-serif" font-size="24" fill="#f85149" text-anchor="middle" font-weight="700">5+ Issues</text>
        <text x="185" y="38" font-family="SF Pro Text, sans-serif" font-size="11" fill="#cc5555" text-anchor="middle">Undetected in Production</text>
      </g>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(440, 260)">
    <rect x="-5" y="-25" width="30" height="50" rx="4" fill="#238636"/>
    <polygon points="5,0 25,0 15,15" fill="white"/>
    <text x="10" y="-8" font-family="SF Mono, monospace" font-size="8" fill="white" text-anchor="middle">VUDA</text>
  </g>

  <!-- AFTER Panel -->
  <g transform="translate(470, 60)" filter="url(#shadow3)">
    <!-- Panel frame -->
    <rect width="400" height="400" rx="12" fill="#1e1e32" stroke="#3fb950" stroke-width="2"/>

    <!-- Header -->
    <rect width="400" height="40" rx="12" fill="url(#successGrad)"/>
    <rect y="28" width="400" height="12" fill="url(#successGrad)"/>
    <text x="200" y="27" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">AFTER: VUDA Scan (23s)</text>

    <!-- Detection cards -->
    <g transform="translate(15, 55)">

      <!-- Detection 1 -->
      <g transform="translate(0, 0)">
        <rect width="175" height="80" rx="8" fill="#1a3020" stroke="#3fb950" stroke-width="1"/>
        <!-- Check icon -->
        <circle cx="30" cy="30" r="16" fill="#3fb950"/>
        <polyline points="22,30 28,36 38,24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="110" y="25" font-family="SF Mono, monospace" font-size="9" fill="#3fb950" text-anchor="middle">sitemap_crawler</text>
        <text x="110" y="42" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">3 broken</text>
        <text x="110" y="58" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">links found</text>
      </g>

      <!-- Detection 2 -->
      <g transform="translate(190, 0)">
        <rect width="175" height="80" rx="8" fill="#1a3020" stroke="#3fb950" stroke-width="1"/>
        <circle cx="30" cy="30" r="16" fill="#3fb950"/>
        <polyline points="22,30 28,36 38,24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="110" y="25" font-family="SF Mono, monospace" font-size="9" fill="#3fb950" text-anchor="middle">performance</text>
        <text x="110" y="42" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">5 slow</text>
        <text x="110" y="58" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">pages flagged</text>
      </g>

      <!-- Detection 3 -->
      <g transform="translate(0, 95)">
        <rect width="175" height="80" rx="8" fill="#1a3020" stroke="#3fb950" stroke-width="1"/>
        <circle cx="30" cy="30" r="16" fill="#3fb950"/>
        <polyline points="22,30 28,36 38,24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="110" y="25" font-family="SF Mono, monospace" font-size="9" fill="#3fb950" text-anchor="middle">console_monitor</text>
        <text x="110" y="42" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">47 errors</text>
        <text x="110" y="58" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">with stack traces</text>
      </g>

      <!-- Detection 4 -->
      <g transform="translate(190, 95)">
        <rect width="175" height="80" rx="8" fill="#1a3020" stroke="#3fb950" stroke-width="1"/>
        <circle cx="30" cy="30" r="16" fill="#3fb950"/>
        <polyline points="22,30 28,36 38,24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="110" y="25" font-family="SF Mono, monospace" font-size="9" fill="#3fb950" text-anchor="middle">batch_screenshot</text>
        <text x="110" y="42" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">94 captures</text>
        <text x="110" y="58" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">desktop + mobile</text>
      </g>

      <!-- Detection 5 -->
      <g transform="translate(0, 190)">
        <rect width="175" height="80" rx="8" fill="#1a3020" stroke="#3fb950" stroke-width="1"/>
        <circle cx="30" cy="30" r="16" fill="#3fb950"/>
        <polyline points="22,30 28,36 38,24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="110" y="25" font-family="SF Mono, monospace" font-size="9" fill="#3fb950" text-anchor="middle">flow_validator</text>
        <text x="110" y="42" font-family="SF Pro Display, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">12 flows</text>
        <text x="110" y="58" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">tested E2E</text>
      </g>

      <!-- All detected -->
      <g transform="translate(190, 190)">
        <rect width="175" height="80" rx="8" fill="#1a3528" stroke="#3fb950" stroke-width="2"/>
        <!-- Big checkmark -->
        <circle cx="88" cy="35" r="22" fill="#3fb950" opacity="0.2"/>
        <polyline points="75,35 85,45 100,28" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="88" y="68" font-family="SF Pro Text, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle" font-weight="600">All Found</text>
      </g>

      <!-- Bottom summary -->
      <g transform="translate(0, 290)">
        <rect width="370" height="45" rx="8" fill="#1a3528" stroke="#3fb950" stroke-width="1"/>
        <text x="185" y="20" font-family="SF Pro Display, sans-serif" font-size="24" fill="#3fb950" text-anchor="middle" font-weight="700">100% Coverage</text>
        <text x="185" y="38" font-family="SF Pro Text, sans-serif" font-size="11" fill="#55cc77" text-anchor="middle">All Issues Detected in 23 Seconds</text>
      </g>
    </g>
  </g>
</svg>
