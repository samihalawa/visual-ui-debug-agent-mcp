<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#8957e5"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>
  
  <rect width="900" height="400" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="35" font-family="system-ui" font-size="18" fill="#8b949e" text-anchor="middle" font-weight="600">VUDA Architecture</text>
  
  <!-- AI Model box -->
  <g transform="translate(50, 80)">
    <rect width="160" height="100" rx="8" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
    <text x="80" y="40" font-family="system-ui" font-size="14" fill="#a371f7" text-anchor="middle" font-weight="600">AI Model</text>
    <text x="80" y="60" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">Claude / GPT</text>
    <text x="80" y="75" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">Any LLM</text>
  </g>
  
  <!-- Arrow 1 -->
  <line x1="210" y1="130" x2="280" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="245" y="120" font-family="monospace" font-size="10" fill="#58a6ff" text-anchor="middle">MCP</text>
  
  <!-- VUDA Server box -->
  <g transform="translate(290, 60)">
    <rect width="200" height="140" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="100" y="30" font-family="system-ui" font-size="16" fill="#58a6ff" text-anchor="middle" font-weight="700">VUDA Server</text>
    <line x1="20" y1="45" x2="180" y2="45" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="70" font-family="monospace" font-size="11" fill="#3fb950" text-anchor="middle">29 MCP Tools</text>
    <text x="100" y="90" font-family="system-ui" font-size="10" fill="#8b949e" text-anchor="middle">• Screenshot &amp; Analysis</text>
    <text x="100" y="105" font-family="system-ui" font-size="10" fill="#8b949e" text-anchor="middle">• Workflow Validation</text>
    <text x="100" y="120" font-family="system-ui" font-size="10" fill="#8b949e" text-anchor="middle">• Performance Metrics</text>
  </g>
  
  <!-- Arrow 2 -->
  <line x1="490" y1="130" x2="560" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="525" y="120" font-family="monospace" font-size="10" fill="#58a6ff" text-anchor="middle">ONE API</text>
  
  <!-- Playwright box -->
  <g transform="translate(570, 80)">
    <rect width="140" height="100" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="2"/>
    <text x="70" y="40" font-family="system-ui" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="600">Playwright</text>
    <text x="70" y="60" font-family="system-ui" font-size="10" fill="#8b949e" text-anchor="middle">Shared Context</text>
    <text x="70" y="75" font-family="system-ui" font-size="10" fill="#8b949e" text-anchor="middle">Cookies + State</text>
  </g>
  
  <!-- Arrow 3 -->
  <line x1="710" y1="130" x2="738" y2="130" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Browser box -->
  <g transform="translate(748, 70)">
    <rect width="122" height="120" rx="8" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <text x="61" y="25" font-family="system-ui" font-size="12" fill="#f0883e" text-anchor="middle" font-weight="600">Browser</text>
    <text x="61" y="47" font-family="system-ui" font-size="10" fill="#c9d1d9" text-anchor="middle">Local Chromium</text>
    <text x="61" y="65" font-family="system-ui" font-size="10" fill="#c9d1d9" text-anchor="middle">Browserbase</text>
    <text x="61" y="83" font-family="system-ui" font-size="10" fill="#c9d1d9" text-anchor="middle">Anchor Browser</text>
    <text x="61" y="101" font-family="system-ui" font-size="10" fill="#c9d1d9" text-anchor="middle">Any CDP endpoint</text>
  </g>
  
  <!-- Tools section -->
  <g transform="translate(50, 240)">
    <text x="0" y="0" font-family="system-ui" font-size="14" fill="#8b949e" font-weight="600">Available Tools:</text>
    
    <!-- Tool badges -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#238636"/>
      <text x="70" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">screenshot_url</text>
    </g>
    <g transform="translate(150, 20)">
      <rect x="0" y="0" width="180" height="24" rx="4" fill="#1f6feb"/>
      <text x="90" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">enhanced_page_analyzer</text>
    </g>
    <g transform="translate(340, 20)">
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#8957e5"/>
      <text x="80" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">ui_workflow_validator</text>
    </g>
    <g transform="translate(510, 20)">
      <rect x="0" y="0" width="150" height="24" rx="4" fill="#f0883e"/>
      <text x="75" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">api_endpoint_tester</text>
    </g>
    <g transform="translate(670, 20)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#f85149"/>
      <text x="70" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">visual_comparison</text>
    </g>
    
    <!-- Second row -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#3fb950"/>
      <text x="65" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">dom_inspector</text>
    </g>
    <g transform="translate(140, 55)">
      <rect x="0" y="0" width="150" height="24" rx="4" fill="#58a6ff"/>
      <text x="75" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">console_monitor</text>
    </g>
    <g transform="translate(300, 55)">
      <rect x="0" y="0" width="170" height="24" rx="4" fill="#a371f7"/>
      <text x="85" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">performance_analysis</text>
    </g>
    <g transform="translate(480, 55)">
      <rect x="0" y="0" width="140" height="24" rx="4" fill="#d29922"/>
      <text x="70" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">sitemap_crawler</text>
    </g>
    <g transform="translate(630, 55)">
      <rect x="0" y="0" width="100" height="24" rx="4" fill="#6e7681"/>
      <text x="50" y="16" font-family="monospace" font-size="10" fill="white" text-anchor="middle">+20 more</text>
    </g>
  </g>
</svg>
