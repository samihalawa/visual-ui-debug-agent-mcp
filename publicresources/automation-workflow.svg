<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a"/>
      <stop offset="100%" style="stop-color:#fee140"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff416c"/>
      <stop offset="100%" style="stop-color:#ff4b2b"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="url(#bgGrad2)"/>

  <!-- Animated dots background -->
  <g opacity="0.15">
    <circle cx="50" cy="100" r="2" fill="#667eea"/>
    <circle cx="150" cy="50" r="1.5" fill="#38ef7d"/>
    <circle cx="300" cy="380" r="2" fill="#4facfe"/>
    <circle cx="500" cy="30" r="1.5" fill="#fa709a"/>
    <circle cx="700" cy="400" r="2" fill="#667eea"/>
    <circle cx="850" cy="80" r="1.5" fill="#38ef7d"/>
    <circle cx="100" cy="350" r="2" fill="#4facfe"/>
    <circle cx="800" cy="200" r="1.5" fill="#fa709a"/>
  </g>

  <!-- Title -->
  <text x="450" y="40" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="600">One Command. Complete Analysis.</text>

  <!-- Step 1: Input -->
  <g transform="translate(40, 100)" filter="url(#shadow2)">
    <rect width="130" height="100" rx="12" fill="#1e1e35" stroke="#333355" stroke-width="1"/>
    <rect width="130" height="30" rx="12" fill="url(#purpleGrad)"/>
    <rect y="18" width="130" height="12" fill="url(#purpleGrad)"/>
    <text x="65" y="21" font-family="SF Pro Text, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">INPUT</text>

    <!-- Terminal icon -->
    <rect x="35" y="45" width="60" height="40" rx="4" fill="#0d0d15" stroke="#444466" stroke-width="1"/>
    <text x="42" y="60" font-family="SF Mono, monospace" font-size="8" fill="#38ef7d">$</text>
    <rect x="50" y="54" width="35" height="3" rx="1" fill="#667eea"/>
    <rect x="42" y="68" width="45" height="3" rx="1" fill="#444466"/>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(175, 145)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#667eea" stroke-width="2" stroke-dasharray="4,2"/>
    <polygon points="35,-5 45,0 35,5" fill="#667eea"/>
  </g>

  <!-- Step 2: Crawler -->
  <g transform="translate(225, 80)" filter="url(#shadow2)">
    <rect width="150" height="140" rx="12" fill="#1e1e35" stroke="#333355" stroke-width="1"/>
    <rect width="150" height="30" rx="12" fill="url(#greenGrad)"/>
    <rect y="18" width="150" height="12" fill="url(#greenGrad)"/>
    <text x="75" y="21" font-family="SF Mono, monospace" font-size="10" fill="white" text-anchor="middle" font-weight="600">sitemap_crawler</text>

    <!-- Spider web icon -->
    <g transform="translate(55, 45)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#38ef7d" stroke-width="1" opacity="0.3"/>
      <circle cx="20" cy="20" r="10" fill="none" stroke="#38ef7d" stroke-width="1" opacity="0.5"/>
      <circle cx="20" cy="20" r="4" fill="#38ef7d"/>
      <line x1="20" y1="2" x2="20" y2="38" stroke="#38ef7d" stroke-width="1" opacity="0.4"/>
      <line x1="2" y1="20" x2="38" y2="20" stroke="#38ef7d" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- Stats -->
    <text x="75" y="100" font-family="SF Pro Display, sans-serif" font-size="24" fill="#38ef7d" text-anchor="middle" font-weight="700">47</text>
    <text x="75" y="118" font-family="SF Pro Text, sans-serif" font-size="10" fill="#8888aa" text-anchor="middle">pages found</text>
  </g>

  <!-- Arrow 2 (splits) -->
  <g transform="translate(380, 150)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38ef7d" stroke-width="2"/>
    <line x1="25" y1="0" x2="45" y2="-60" stroke="#4facfe" stroke-width="2"/>
    <line x1="25" y1="0" x2="45" y2="0" stroke="#fa709a" stroke-width="2"/>
    <line x1="25" y1="0" x2="45" y2="60" stroke="#ffd93d" stroke-width="2"/>
    <circle cx="25" cy="0" r="4" fill="#38ef7d"/>
  </g>

  <!-- Parallel Tools -->
  <!-- Tool 1: Screenshots -->
  <g transform="translate(430, 55)" filter="url(#shadow2)">
    <rect width="140" height="90" rx="10" fill="#1e1e35" stroke="#4facfe" stroke-width="1.5"/>
    <rect width="140" height="26" rx="10" fill="url(#blueGrad)"/>
    <rect y="16" width="140" height="10" fill="url(#blueGrad)"/>
    <text x="70" y="18" font-family="SF Mono, monospace" font-size="9" fill="white" text-anchor="middle" font-weight="600">screenshots</text>

    <!-- Camera icon -->
    <rect x="50" y="38" width="40" height="28" rx="4" fill="#2a2a45" stroke="#4facfe" stroke-width="1"/>
    <circle cx="70" cy="52" r="8" fill="none" stroke="#4facfe" stroke-width="1.5"/>
    <circle cx="70" cy="52" r="3" fill="#4facfe"/>

    <text x="70" y="82" font-family="SF Pro Text, sans-serif" font-size="10" fill="#4facfe" text-anchor="middle" font-weight="600">94 captures</text>
  </g>

  <!-- Tool 2: Flow Validator -->
  <g transform="translate(430, 155)" filter="url(#shadow2)">
    <rect width="140" height="90" rx="10" fill="#1e1e35" stroke="#fa709a" stroke-width="1.5"/>
    <rect width="140" height="26" rx="10" fill="url(#orangeGrad)"/>
    <rect y="16" width="140" height="10" fill="url(#orangeGrad)"/>
    <text x="70" y="18" font-family="SF Mono, monospace" font-size="9" fill="white" text-anchor="middle" font-weight="600">flow_validator</text>

    <!-- Flow icon -->
    <g transform="translate(45, 38)">
      <circle cx="10" cy="14" r="6" fill="#fa709a" opacity="0.3"/>
      <circle cx="25" cy="6" r="6" fill="#fa709a" opacity="0.5"/>
      <circle cx="40" cy="14" r="6" fill="#fa709a" opacity="0.7"/>
      <circle cx="25" cy="22" r="6" fill="#fa709a"/>
      <line x1="10" y1="14" x2="25" y2="6" stroke="#fa709a" stroke-width="1.5"/>
      <line x1="25" y1="6" x2="40" y2="14" stroke="#fa709a" stroke-width="1.5"/>
      <line x1="40" y1="14" x2="25" y2="22" stroke="#fa709a" stroke-width="1.5"/>
      <line x1="25" y1="22" x2="10" y2="14" stroke="#fa709a" stroke-width="1.5"/>
    </g>

    <text x="70" y="82" font-family="SF Pro Text, sans-serif" font-size="10" fill="#fa709a" text-anchor="middle" font-weight="600">12 flows OK</text>
  </g>

  <!-- Tool 3: Performance -->
  <g transform="translate(430, 255)" filter="url(#shadow2)">
    <rect width="140" height="90" rx="10" fill="#1e1e35" stroke="#ffd93d" stroke-width="1.5"/>
    <rect width="140" height="26" rx="10" fill="#ffd93d"/>
    <rect y="16" width="140" height="10" fill="#ffd93d"/>
    <text x="70" y="18" font-family="SF Mono, monospace" font-size="9" fill="#1a1a2e" text-anchor="middle" font-weight="600">performance</text>

    <!-- Chart icon -->
    <g transform="translate(40, 38)">
      <rect x="0" y="20" width="12" height="16" rx="2" fill="#ffd93d" opacity="0.4"/>
      <rect x="18" y="12" width="12" height="24" rx="2" fill="#ffd93d" opacity="0.6"/>
      <rect x="36" y="4" width="12" height="32" rx="2" fill="#ffd93d" opacity="0.8"/>
      <rect x="54" y="16" width="12" height="20" rx="2" fill="#ffd93d"/>
    </g>

    <text x="70" y="82" font-family="SF Pro Text, sans-serif" font-size="10" fill="#ffd93d" text-anchor="middle" font-weight="600">5 slow pages</text>
  </g>

  <!-- Arrows to results -->
  <g transform="translate(575, 100)">
    <line x1="0" y1="0" x2="30" y2="50" stroke="#4facfe" stroke-width="2"/>
  </g>
  <g transform="translate(575, 200)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#fa709a" stroke-width="2"/>
  </g>
  <g transform="translate(575, 300)">
    <line x1="0" y1="0" x2="30" y2="-50" stroke="#ffd93d" stroke-width="2"/>
  </g>

  <!-- Results Panel -->
  <g transform="translate(610, 100)" filter="url(#shadow2)">
    <rect width="250" height="220" rx="14" fill="#1e1e35" stroke="#38ef7d" stroke-width="2"/>

    <!-- Header -->
    <rect width="250" height="35" rx="14" fill="url(#greenGrad)"/>
    <rect y="22" width="250" height="13" fill="url(#greenGrad)"/>
    <text x="125" y="24" font-family="SF Pro Display, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="600">RESULTS</text>

    <!-- Result items -->
    <g transform="translate(15, 50)">
      <!-- Screenshots -->
      <g transform="translate(0, 0)">
        <rect width="105" height="50" rx="8" fill="#162a35" stroke="#4facfe" stroke-width="1"/>
        <text x="52" y="22" font-family="SF Pro Display, sans-serif" font-size="18" fill="#4facfe" text-anchor="middle" font-weight="700">94</text>
        <text x="52" y="40" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">screenshots</text>
      </g>

      <!-- Broken links -->
      <g transform="translate(115, 0)">
        <rect width="105" height="50" rx="8" fill="#351a20" stroke="#ff6b6b" stroke-width="1"/>
        <text x="52" y="22" font-family="SF Pro Display, sans-serif" font-size="18" fill="#ff6b6b" text-anchor="middle" font-weight="700">3</text>
        <text x="52" y="40" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">broken links</text>
      </g>

      <!-- Slow pages -->
      <g transform="translate(0, 60)">
        <rect width="105" height="50" rx="8" fill="#352a1a" stroke="#ffd93d" stroke-width="1"/>
        <text x="52" y="22" font-family="SF Pro Display, sans-serif" font-size="18" fill="#ffd93d" text-anchor="middle" font-weight="700">5</text>
        <text x="52" y="40" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">slow pages</text>
      </g>

      <!-- Flows validated -->
      <g transform="translate(115, 60)">
        <rect width="105" height="50" rx="8" fill="#1a3528" stroke="#38ef7d" stroke-width="1"/>
        <text x="52" y="22" font-family="SF Pro Display, sans-serif" font-size="18" fill="#38ef7d" text-anchor="middle" font-weight="700">12</text>
        <text x="52" y="40" font-family="SF Pro Text, sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">flows passed</text>
      </g>
    </g>

    <!-- Time badge -->
    <g transform="translate(60, 175)">
      <rect width="130" height="32" rx="16" fill="#0f0f1a" stroke="#38ef7d" stroke-width="1"/>
      <text x="65" y="21" font-family="SF Pro Display, sans-serif" font-size="14" fill="#38ef7d" text-anchor="middle" font-weight="600">23.4 seconds</text>
    </g>
  </g>
</svg>
