<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#252542"/>
      <stop offset="100%" style="stop-color:#1e1e38"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e"/>
      <stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="900" height="520" fill="url(#grid)"/>

  <!-- Claude Desktop Window -->
  <g transform="translate(30, 25)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect width="840" height="470" rx="12" fill="#1e1e32" stroke="#333355" stroke-width="1"/>

    <!-- Title bar -->
    <rect width="840" height="40" rx="12" fill="#252545"/>
    <rect y="28" width="840" height="12" fill="#252545"/>

    <!-- Window controls -->
    <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="20" r="6" fill="#28ca42"/>

    <!-- App title -->
    <text x="420" y="25" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#8888aa" text-anchor="middle">Claude Desktop</text>

    <!-- Chat area -->
    <g transform="translate(20, 55)">

      <!-- User message bubble -->
      <g transform="translate(500, 0)">
        <rect width="290" height="50" rx="18" fill="#667eea"/>
        <text x="20" y="30" font-family="SF Pro Text, -apple-system, sans-serif" font-size="14" fill="white">Test all links on example.com</text>
      </g>

      <!-- AI Response with tool use -->
      <g transform="translate(20, 70)">
        <!-- Avatar -->
        <circle cx="18" cy="18" r="18" fill="url(#greenAccent)"/>
        <text x="18" y="24" font-family="SF Pro Text, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">AI</text>

        <!-- Message area -->
        <g transform="translate(50, 0)">
          <rect width="700" height="320" rx="16" fill="url(#cardGrad)" stroke="#333355" stroke-width="1"/>

          <!-- Tool badge -->
          <rect x="15" y="15" width="140" height="28" rx="14" fill="url(#blueAccent)"/>
          <text x="85" y="34" font-family="SF Mono, monospace" font-size="11" fill="white" text-anchor="middle">sitemap_crawler</text>

          <!-- Status indicator -->
          <circle cx="680" cy="29" r="8" fill="#28ca42" filter="url(#glow)"/>

          <!-- Results cards -->
          <g transform="translate(15, 55)">
            <!-- Stats row -->
            <g transform="translate(0, 0)">
              <rect width="160" height="70" rx="10" fill="#1a1a30" stroke="#333355" stroke-width="1"/>
              <text x="80" y="28" font-family="SF Pro Display, sans-serif" font-size="28" fill="#38ef7d" text-anchor="middle" font-weight="700">47</text>
              <text x="80" y="50" font-family="SF Pro Text, sans-serif" font-size="12" fill="#8888aa" text-anchor="middle">Pages Found</text>
            </g>

            <g transform="translate(175, 0)">
              <rect width="160" height="70" rx="10" fill="#1a1a30" stroke="#333355" stroke-width="1"/>
              <text x="80" y="28" font-family="SF Pro Display, sans-serif" font-size="28" fill="#ff6b6b" text-anchor="middle" font-weight="700">3</text>
              <text x="80" y="50" font-family="SF Pro Text, sans-serif" font-size="12" fill="#8888aa" text-anchor="middle">Broken Links</text>
            </g>

            <g transform="translate(350, 0)">
              <rect width="160" height="70" rx="10" fill="#1a1a30" stroke="#333355" stroke-width="1"/>
              <text x="80" y="28" font-family="SF Pro Display, sans-serif" font-size="28" fill="#ffd93d" text-anchor="middle" font-weight="700">1.2s</text>
              <text x="80" y="50" font-family="SF Pro Text, sans-serif" font-size="12" fill="#8888aa" text-anchor="middle">Avg Load Time</text>
            </g>

            <g transform="translate(525, 0)">
              <rect width="145" height="70" rx="10" fill="#1a1a30" stroke="#333355" stroke-width="1"/>
              <text x="72" y="28" font-family="SF Pro Display, sans-serif" font-size="28" fill="#667eea" text-anchor="middle" font-weight="700">94</text>
              <text x="72" y="50" font-family="SF Pro Text, sans-serif" font-size="12" fill="#8888aa" text-anchor="middle">Screenshots</text>
            </g>
          </g>

          <!-- Screenshot thumbnails -->
          <g transform="translate(15, 140)">
            <text x="0" y="15" font-family="SF Pro Text, sans-serif" font-size="12" fill="#8888aa">Captured Pages</text>

            <g transform="translate(0, 25)">
              <rect width="105" height="70" rx="6" fill="#2a2a45" stroke="#444466" stroke-width="1"/>
              <rect x="8" y="8" width="89" height="12" rx="2" fill="#333355"/>
              <rect x="8" y="25" width="60" height="6" rx="1" fill="#444466"/>
              <rect x="8" y="35" width="75" height="6" rx="1" fill="#444466"/>
              <rect x="8" y="45" width="45" height="6" rx="1" fill="#444466"/>
              <text x="52" y="65" font-family="SF Mono, monospace" font-size="9" fill="#667eea" text-anchor="middle">/home</text>
            </g>

            <g transform="translate(115, 25)">
              <rect width="105" height="70" rx="6" fill="#2a2a45" stroke="#444466" stroke-width="1"/>
              <rect x="8" y="8" width="89" height="12" rx="2" fill="#333355"/>
              <rect x="8" y="25" width="55" height="6" rx="1" fill="#444466"/>
              <rect x="8" y="35" width="70" height="6" rx="1" fill="#444466"/>
              <rect x="8" y="45" width="40" height="6" rx="1" fill="#444466"/>
              <text x="52" y="65" font-family="SF Mono, monospace" font-size="9" fill="#667eea" text-anchor="middle">/about</text>
            </g>

            <g transform="translate(230, 25)">
              <rect width="105" height="70" rx="6" fill="#2a2a45" stroke="#444466" stroke-width="1"/>
              <rect x="8" y="8" width="89" height="12" rx="2" fill="#333355"/>
              <rect x="8" y="25" width="65" height="6" rx="1" fill="#444466"/>
              <rect x="8" y="35" width="50" height="6" rx="1" fill="#444466"/>
              <rect x="8" y="45" width="70" height="6" rx="1" fill="#444466"/>
              <text x="52" y="65" font-family="SF Mono, monospace" font-size="9" fill="#667eea" text-anchor="middle">/products</text>
            </g>

            <g transform="translate(345, 25)">
              <rect width="105" height="70" rx="6" fill="#2a2a45" stroke="#ff6b6b" stroke-width="2"/>
              <rect x="8" y="8" width="89" height="12" rx="2" fill="#333355"/>
              <rect x="8" y="28" width="89" height="30" rx="2" fill="#3a2a35"/>
              <text x="52" y="48" font-family="SF Pro Text, sans-serif" font-size="10" fill="#ff6b6b" text-anchor="middle">404</text>
              <text x="52" y="65" font-family="SF Mono, monospace" font-size="9" fill="#ff6b6b" text-anchor="middle">/team</text>
            </g>

            <g transform="translate(460, 25)">
              <rect width="105" height="70" rx="6" fill="#2a2a45" stroke="#444466" stroke-width="1"/>
              <rect x="30" y="20" width="45" height="30" rx="4" fill="#333355"/>
              <text x="52" y="40" font-family="SF Pro Display, sans-serif" font-size="16" fill="#667eea" text-anchor="middle">+43</text>
              <text x="52" y="65" font-family="SF Mono, monospace" font-size="9" fill="#8888aa" text-anchor="middle">more</text>
            </g>
          </g>

          <!-- Progress bar -->
          <g transform="translate(15, 250)">
            <rect width="670" height="8" rx="4" fill="#1a1a30"/>
            <rect width="670" height="8" rx="4" fill="url(#greenAccent)"/>
          </g>

          <!-- Bottom status -->
          <g transform="translate(15, 275)">
            <text x="0" y="15" font-family="SF Pro Text, sans-serif" font-size="12" fill="#38ef7d">Completed in 12.3s</text>
            <text x="670" y="15" font-family="SF Pro Text, sans-serif" font-size="12" fill="#8888aa" text-anchor="end">VUDA MCP</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
