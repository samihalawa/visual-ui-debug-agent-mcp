<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#238636"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#1f6feb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#8957e5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="35" font-family="SF Mono, Consolas, monospace" font-size="16" fill="#58a6ff" text-anchor="middle" font-weight="600">Claude Desktop + VUDA MCP Tool Calls</text>

  <!-- User Message -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="840" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="25" cy="25" r="12" fill="#a371f7"/>
    <text x="25" y="30" font-family="system-ui" font-size="12" fill="white" text-anchor="middle">U</text>
    <text x="50" y="20" font-family="system-ui" font-size="11" fill="#8b949e">User</text>
    <text x="50" y="38" font-family="system-ui" font-size="13" fill="#c9d1d9">"Test all links on example.com and check for broken pages"</text>
  </g>

  <!-- AI Response with Tool Call 1 -->
  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="840" height="140" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <circle cx="25" cy="20" r="12" fill="url(#greenGrad)"/>
    <text x="25" y="25" font-family="system-ui" font-size="10" fill="white" text-anchor="middle">AI</text>
    <text x="50" y="18" font-family="system-ui" font-size="11" fill="#3fb950">Claude</text>
    <text x="100" y="18" font-family="SF Mono, monospace" font-size="10" fill="#6e7681">using VUDA MCP</text>

    <!-- Tool Call Box -->
    <rect x="15" y="35" width="810" height="95" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <rect x="15" y="35" width="810" height="22" rx="6" fill="#21262d"/>
    <text x="30" y="51" font-family="SF Mono, monospace" font-size="11" fill="#58a6ff">Tool Call: sitemap_crawler</text>
    <circle cx="800" cy="46" r="6" fill="#3fb950"/>

    <text x="30" y="75" font-family="SF Mono, monospace" font-size="11" fill="#8b949e">{</text>
    <text x="45" y="92" font-family="SF Mono, monospace" font-size="11" fill="#a371f7">"url"</text>
    <text x="80" y="92" font-family="SF Mono, monospace" font-size="11" fill="#8b949e">:</text>
    <text x="95" y="92" font-family="SF Mono, monospace" font-size="11" fill="#a5d6ff">"https://example.com"</text>
    <text x="250" y="92" font-family="SF Mono, monospace" font-size="11" fill="#8b949e">,</text>
    <text x="45" y="109" font-family="SF Mono, monospace" font-size="11" fill="#a371f7">"maxDepth"</text>
    <text x="120" y="109" font-family="SF Mono, monospace" font-size="11" fill="#8b949e">:</text>
    <text x="135" y="109" font-family="SF Mono, monospace" font-size="11" fill="#79c0ff">3</text>
    <text x="145" y="109" font-family="SF Mono, monospace" font-size="11" fill="#8b949e">,</text>
    <text x="160" y="109" font-family="SF Mono, monospace" font-size="11" fill="#a371f7">"checkBrokenLinks"</text>
    <text x="300" y="109" font-family="SF Mono, monospace" font-size="11" fill="#8b949e">:</text>
    <text x="315" y="109" font-family="SF Mono, monospace" font-size="11" fill="#79c0ff">true</text>
    <text x="30" y="123" font-family="SF Mono, monospace" font-size="11" fill="#8b949e">}</text>
  </g>

  <!-- Tool Result -->
  <g transform="translate(30, 265)">
    <rect x="0" y="0" width="840" height="150" rx="8" fill="#0d1117" stroke="#1f6feb" stroke-width="1"/>
    <rect x="0" y="0" width="840" height="25" rx="8" fill="#161b22"/>
    <text x="15" y="17" font-family="SF Mono, monospace" font-size="11" fill="#58a6ff">Result: 47 pages crawled in 12.3s</text>
    <circle cx="810" cy="12" r="6" fill="#3fb950"/>

    <!-- Results visualization -->
    <g transform="translate(15, 35)">
      <rect x="0" y="0" width="200" height="105" rx="4" fill="#21262d"/>
      <text x="10" y="20" font-family="SF Mono, monospace" font-size="10" fill="#3fb950">Pages Found: 47</text>
      <text x="10" y="38" font-family="SF Mono, monospace" font-size="10" fill="#f85149">Broken Links: 3</text>
      <text x="10" y="56" font-family="SF Mono, monospace" font-size="10" fill="#d29922">Slow Pages: 5</text>
      <text x="10" y="74" font-family="SF Mono, monospace" font-size="10" fill="#58a6ff">Redirects: 8</text>
      <text x="10" y="92" font-family="SF Mono, monospace" font-size="10" fill="#8b949e">Avg Load: 1.2s</text>
    </g>

    <!-- Visual bar chart -->
    <g transform="translate(230, 35)">
      <text x="0" y="15" font-family="system-ui" font-size="10" fill="#8b949e">Response Status</text>
      <rect x="0" y="25" width="280" height="12" rx="2" fill="#238636"/>
      <rect x="280" y="25" width="30" height="12" rx="2" fill="#d29922"/>
      <rect x="310" y="25" width="18" height="12" rx="2" fill="#f85149"/>
      <text x="0" y="52" font-family="SF Mono, monospace" font-size="9" fill="#3fb950">200 OK (85%)</text>
      <text x="100" y="52" font-family="SF Mono, monospace" font-size="9" fill="#d29922">3xx (9%)</text>
      <text x="170" y="52" font-family="SF Mono, monospace" font-size="9" fill="#f85149">4xx (6%)</text>

      <!-- Broken links list -->
      <text x="0" y="75" font-family="system-ui" font-size="10" fill="#f85149">Broken Links Detected:</text>
      <text x="0" y="92" font-family="SF Mono, monospace" font-size="9" fill="#8b949e">/about/team → 404</text>
      <text x="150" y="92" font-family="SF Mono, monospace" font-size="9" fill="#8b949e">/blog/old-post → 404</text>
      <text x="300" y="92" font-family="SF Mono, monospace" font-size="9" fill="#8b949e">/products/legacy → 410</text>
    </g>

    <!-- Screenshot thumbnails -->
    <g transform="translate(590, 35)">
      <text x="0" y="15" font-family="system-ui" font-size="10" fill="#8b949e">Screenshots Captured</text>
      <rect x="0" y="22" width="55" height="35" rx="3" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
      <rect x="60" y="22" width="55" height="35" rx="3" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
      <rect x="120" y="22" width="55" height="35" rx="3" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
      <rect x="180" y="22" width="55" height="35" rx="3" fill="#30363d" stroke="#58a6ff" stroke-width="1"/>
      <text x="27" y="45" font-family="SF Mono, monospace" font-size="8" fill="#58a6ff" text-anchor="middle">home</text>
      <text x="87" y="45" font-family="SF Mono, monospace" font-size="8" fill="#58a6ff" text-anchor="middle">about</text>
      <text x="147" y="45" font-family="SF Mono, monospace" font-size="8" fill="#58a6ff" text-anchor="middle">blog</text>
      <text x="207" y="45" font-family="SF Mono, monospace" font-size="8" fill="#58a6ff" text-anchor="middle">+44</text>
    </g>
  </g>

  <!-- AI Follow-up with navigation_flow_validator -->
  <g transform="translate(30, 425)">
    <rect x="0" y="0" width="840" height="85" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <circle cx="25" cy="20" r="12" fill="url(#purpleGrad)"/>
    <text x="25" y="25" font-family="system-ui" font-size="10" fill="white" text-anchor="middle">AI</text>
    <text x="50" y="18" font-family="system-ui" font-size="11" fill="#a371f7">Claude</text>
    <text x="15" y="48" font-family="system-ui" font-size="12" fill="#c9d1d9">Found 3 broken links. Now validating navigation flows...</text>

    <!-- Second Tool Call inline -->
    <rect x="15" y="58" width="350" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="25" y="73" font-family="SF Mono, monospace" font-size="10" fill="#58a6ff">Tool: navigation_flow_validator</text>
    <circle cx="350" cy="69" r="5" fill="#d29922">
      <animate attributeName="fill" values="#d29922;#3fb950;#3fb950" dur="2s" repeatCount="indefinite"/>
    </circle>

    <rect x="375" y="58" width="250" height="22" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="385" y="73" font-family="SF Mono, monospace" font-size="10" fill="#58a6ff">Tool: batch_screenshot_urls</text>
    <circle cx="610" cy="69" r="5" fill="#d29922">
      <animate attributeName="fill" values="#d29922;#d29922;#3fb950" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Status bar -->
  <g transform="translate(30, 520)">
    <rect x="0" y="0" width="840" height="60" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="25" font-family="system-ui" font-size="12" fill="#8b949e">Session Stats:</text>

    <rect x="130" y="10" width="100" height="40" rx="4" fill="#0d1117"/>
    <text x="180" y="28" font-family="SF Mono, monospace" font-size="10" fill="#3fb950" text-anchor="middle">5 Tools Used</text>
    <text x="180" y="42" font-family="SF Mono, monospace" font-size="9" fill="#6e7681" text-anchor="middle">in this session</text>

    <rect x="240" y="10" width="100" height="40" rx="4" fill="#0d1117"/>
    <text x="290" y="28" font-family="SF Mono, monospace" font-size="10" fill="#58a6ff" text-anchor="middle">47 Screenshots</text>
    <text x="290" y="42" font-family="SF Mono, monospace" font-size="9" fill="#6e7681" text-anchor="middle">auto-captured</text>

    <rect x="350" y="10" width="100" height="40" rx="4" fill="#0d1117"/>
    <text x="400" y="28" font-family="SF Mono, monospace" font-size="10" fill="#a371f7" text-anchor="middle">3 Issues Found</text>
    <text x="400" y="42" font-family="SF Mono, monospace" font-size="9" fill="#6e7681" text-anchor="middle">broken links</text>

    <rect x="460" y="10" width="100" height="40" rx="4" fill="#0d1117"/>
    <text x="510" y="28" font-family="SF Mono, monospace" font-size="10" fill="#d29922" text-anchor="middle">18.7s Total</text>
    <text x="510" y="42" font-family="SF Mono, monospace" font-size="9" fill="#6e7681" text-anchor="middle">execution time</text>

    <!-- VUDA badge -->
    <rect x="700" y="12" width="120" height="36" rx="18" fill="url(#blueGrad)"/>
    <text x="760" y="35" font-family="system-ui" font-size="12" fill="white" text-anchor="middle" font-weight="600">Powered by VUDA</text>
  </g>
</svg>
