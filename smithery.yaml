version: 1
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      debug:
        type: boolean
        description: "Enable debug mode for additional logging"
        default: false
      headless:
        type: boolean
        description: "Run browser in headless mode"
        default: true
      maxConcurrentSessions:
        type: number
        description: "Maximum number of concurrent browser sessions"
        default: 5
      screenshotDir:
        type: string
        description: "Directory to store screenshots"
        default: "./temp"
      timeout:
        type: number
        description: "Default timeout for operations in milliseconds"
        default: 4000
        minimum: 1000
        maximum: 120000
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'], 
      env: { 
        DEBUG: config.debug ? 'true' : 'false',
        HEADLESS: config.headless ? 'true' : 'false', 
        MAX_CONCURRENT_SESSIONS: config.maxConcurrentSessions?.toString() || '5',
        SCREENSHOT_DIR: config.screenshotDir || './temp',
        DEFAULT_TIMEOUT: config.timeout?.toString() || '4000'
      } 
    })