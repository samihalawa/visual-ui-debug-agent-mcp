version: 1
runtime: container
startCommand:
  type: stdio
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
healthCheck:
  timeout: 30
  interval: 10
  retries: 3
  startPeriod: 60
configSchema:
  type: object
  properties:
    port:
      type: number
      description: "Port number for the MCP server to run on"
      default: 8080
    debug:
      type: boolean
      description: "Enable debug mode for additional logging"
      default: false
    headless:
      type: boolean
      description: "Run browser in headless mode"
      default: true
    maxConcurrentSessions:
      type: number
      description: "Maximum number of concurrent browser sessions"
      default: 5
    screenshotDir:
      type: string
      description: "Directory to store screenshots"
      default: "./temp"
  required: []
exampleConfig:
  port: 8080
  debug: false
  headless: true
  maxConcurrentSessions: 5
  screenshotDir: "./temp"