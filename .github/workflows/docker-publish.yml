name: Publish Docker Image

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'
      push:
        description: 'Push to Docker Hub'
        required: true
        default: 'true'
        type: boolean

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        if: github.event.inputs.push == 'true' || github.event_name == 'release'
        uses: docker/login-action@v2
        with:
          username: 'luigi12345'
          password: '659777908'
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: samihalawa/visual-ui-debug-agent
          tags: |
            type=raw,value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push == 'true' || github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}