name: Publish npm package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (patch, minor, major, or exact version)
        required: true
        default: patch

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Set manual version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.version }}" =~ ^(patch|minor|major)$ ]]; then
            npm version "${{ github.event.inputs.version }}" --no-git-tag-version
          else
            npm version "${{ github.event.inputs.version }}" --allow-same-version --no-git-tag-version
          fi

      - name: Build and inspect package
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
